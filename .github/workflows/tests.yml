name: pytest and coverage

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run black-box tests and preserve defect evidence
        run: python -m pytest tests/test_blackbox.py -v --junitxml=blackbox-results.xml
      - name: Run complete test suite with coverage
        if: always()
        run: python -m pytest tests/ --cov=registration --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=all-tests-results.xml
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-evidence
          path: |
            blackbox-results.xml
            all-tests-results.xml
            coverage.xml
          if-no-files-found: warn
